# ============================================================================
# General Settings
# ============================================================================

# true color support (Ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc"

# extended keys for Ctrl-Tab / Shift-Ctrl-Tab (Ghostty)
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# prefix key
set -g prefix C-,
unbind C-b
bind C-,  send-prefix

# faster escape (critical for vi mode)
set -sg escape-time 10

# bigger scrollback
set -g history-limit 50000

# index from 1 (ergonomic)
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# don't rename windows automatically
set -g allow-rename off

# remain on exit
set -g remain-on-exit on

# focus events (needed for some plugins and vim autoread)
set -g focus-events on

# switch to another session instead of detaching when a session is killed
set -g detach-on-destroy off

# display pane numbers longer
set -g display-panes-time 4000
set -g display-time 2000

# aggressive resize (useful with multiple clients)
setw -g aggressive-resize on

# mouse
setw -g mouse on

# vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# ============================================================================
# Keybindings
# ============================================================================

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# sane splits (keep working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new window keeps working directory
bind c new-window -c "#{pane_current_path}"

# pane switching (Alt + arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# pane switching (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap panes
bind > swap-pane -D
bind < swap-pane -U

# window switching
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window

# session management
bind S command-prompt -p "New session:" "new-session -A -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind s choose-tree -sZ
bind L switch-client -l
bind b last-window

# floating popup terminal (prefix + g)
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# tmuxinator session picker (prefix + T)
bind P display-popup -E -w 60% -h 40% "session=\$(tmuxinator list -n | tail -n +2 | fzf --prompt='tmuxinator ▸ ') && [ -n \"\$session\" ] && { tmux has-session -t \"\$session\" 2>/dev/null && tmux switch-client -t \"\$session\" || tmuxinator start \"\$session\"; }"

# ============================================================================
# Pane Borders
# ============================================================================

set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} [#{pane_current_command}] "

# ============================================================================
# Theme (Light Powerline - Tomorrow-inspired)
# ============================================================================

source-file ~/.tmux/themes/tomorrow-powerline.tmux

# FZF theme (so tmux plugins inherit it)
set-environment -g FZF_DEFAULT_OPTS "\
  --color=fg:#4d4d4c,bg:#ffffff,hl:#555555 \
  --color=fg+:#1a1a1a,bg+:#e8e8e8,hl+:#333333 \
  --color=info:#888888,prompt:#555555,pointer:#333333 \
  --color=marker:#555555,spinner:#888888,header:#8e908c \
  --color=border:#d6d6d6,gutter:#ffffff,scrollbar:#d6d6d6 \
  --color=separator:#e0e0e0 \
  --border=rounded \
  --margin=0,1 \
  --padding=0,1 \
  --info=inline-right \
  --separator='─' \
  --scrollbar='│' \
  --ellipsis='…' \
  --highlight-line \
  --prompt='▸ ' \
  --pointer='▸' \
  --marker='●'"

# ============================================================================
# Plugins (TPM)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'lost-melody/tmux-command-palette'
set -g @cmdpalette-tables 'prefix,root'
set -g @plugin 'kenos1/tmux-cht-sh'
set -g @plugin 'sainnhe/tmux-fzf'
# tmux-autoreload removed: requires bash 4+ (macOS ships 3.2)

# -- resurrect ---------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'

# -- continuum ----------------------------------------------------------------
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

# -- tmux-thumbs (vimium-style copy) -----------------------------------------
set -g @thumbs-key f
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux display-message "Copied: {}"'

# -- extrakto (fzf scrollback search) ----------------------------------------
set -g @extrakto_key 'tab'
set -g @extrakto_copy_key 'ctrl-y'
set -g @extrakto_insert_key 'enter'
set -g @extrakto_fzf_tool 'fzf'

# -- tmux-fzf-url (open URLs from scrollback) --------------------------------
set -g @fzf-url-bind 'u'
set -g @fzf-url-open "open"

# -- tmux-open (open files/URLs from copy mode) ------------------------------
set -g @open-S 'https://www.google.com/search?q='

# -- tmux-fuzzback (fzf scrollback buffer) -----------------------------------
set -g @fuzzback-bind '/'

# -- tmux-notify (desktop notification on command finish) --------------------
set -g @tnotify-verbose 'on'

# -- tmux-fzf direct switchers (bypass menu) --------------------------------
bind-key 'T' run-shell -b '~/.tmux/plugins/tmux-fzf/scripts/session.sh switch'
bind-key 'W' run-shell -b '~/.tmux/plugins/tmux-fzf/scripts/window.sh switch'

# initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

