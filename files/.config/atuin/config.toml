## Atuin Configuration
## See: https://docs.atuin.sh/configuration/config/

# Search
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
style = "compact"
inline_height = 40
show_preview = true
show_help = false

# Behavior
enter_accept = true
workspaces = true
secrets_filter = true
store_failed = true

# Sync (disabled by default - run `atuin register` or `atuin login` to enable)
auto_sync = false
sync_frequency = "1h"
