tmux:
  symbols:
    branch: " "
    hashprefix: ":"
    ahead: "↑"
    behind: "↓"
    staged: "●"
    conflict: "✖"
    modified: "✚"
    untracked: "…"
    stashed: "⚑"
    clean: "✔"
    insertions: "Σ"
    deletions: "Δ"
  styles:
    clear: "#[fg=default]"
    state: "#[fg=#c82829,bold]"
    branch: "#[fg=#4271ae,bold]"
    remote: "#[fg=#8e908c]"
    divergence: "#[fg=#f5871f]"
    staged: "#[fg=#718c00]"
    conflict: "#[fg=#c82829,bold]"
    modified: "#[fg=#f5871f]"
    untracked: "#[fg=#8e908c]"
    stashed: "#[fg=#3e999f]"
    clean: "#[fg=#718c00]"
    insertions: "#[fg=#718c00]"
    deletions: "#[fg=#c82829]"
  layout:
    - branch
    - " "
    - divergence
    - " "
    - flags
  options:
    branch_max_len: 30
    branch_trim: right
    hide_clean: true
