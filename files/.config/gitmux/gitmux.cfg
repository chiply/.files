# gitmux -- the git segment of the tmux status bar.
#
# Styles name ANSI SLOTS, not hex: slots 0-15 are the only remappable part of
# the terminal's colour table, and Emacs refits them to the current brushup
# page (see ghostel.el), so this segment follows the theme.  Hex pinned it to
# one page and is what made the bar read as a decal.
#
# This segment is drawn straight on the page -- it is the one segment given no
# field of its own, because it carries the most text and wants the full spread
# of the ladder rather than the compressed version a tinted field leaves:
#
#   colour7   9.0   what the repo IS: branch, state, staged, clean
#   colour15  5.5   what has moved: divergence, modified, deletions
#   colour8   3.0   ambient: remote, untracked, stashed
tmux:
  symbols:
    branch: " "
    hashprefix: ":"
    ahead: "↑"
    behind: "↓"
    staged: "●"
    conflict: "✖"
    modified: "✚"
    untracked: "…"
    stashed: "⚑"
    clean: "✔"
    insertions: "Σ"
    deletions: "Δ"
  styles:
    clear: "#[fg=default]"
    state: "#[fg=colour7,bold]"
    branch: "#[fg=colour7,bold]"
    remote: "#[fg=colour8]"
    divergence: "#[fg=colour15]"
    staged: "#[fg=colour7]"
    conflict: "#[fg=colour7,bold]"
    modified: "#[fg=colour15]"
    untracked: "#[fg=colour8]"
    stashed: "#[fg=colour8]"
    clean: "#[fg=colour7]"
    insertions: "#[fg=colour7]"
    deletions: "#[fg=colour15]"
  layout:
    - branch
    - " "
    - divergence
    - " "
    - flags
  options:
    branch_max_len: 30
    branch_trim: right
    hide_clean: true
