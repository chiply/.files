# kb-hub tmux — lean and Termius-friendly.
# Source of truth: ~/.files/hub/tmux.conf, deployed by hub-deploy.
set -g default-terminal "tmux-256color"
set -g prefix C-b                  # dumb-terminal-safe (C-, can't transmit)
set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g status-position top         # mobile keyboards hide the bottom row
set -g detach-on-destroy off
