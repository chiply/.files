# kb-hub tmux — lean and Termius-friendly.
# Source of truth: ~/.files/hub/tmux.conf, deployed by hub-deploy.
set -g default-terminal "tmux-256color"
set -g prefix C-b                  # dumb-terminal-safe (see extended-keys below)
set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g status-position top         # mobile keyboards hide the bottom row
set -g detach-on-destroy off

# 24-bit colour for Emacs inside tmux.  Emacs decides on the CLIENT's
# environment (COLORTERM=truecolor, set in bashrc-additions.sh) or its
# terminfo; this line tells tmux the outer terminal can take RGB so it
# passes the colours through instead of quantising them to 256.
set -as terminal-features ",*:RGB"

# Extended keys (CSI u / modifyOtherKeys) let C-, and friends reach the
# inner program -- the reason the prefix above is C-b.  tmux 3.2+; the hub
# runs 3.4.  Whether Blink emits them is UNTESTED (headless-zetta.org,
# Phase C): if keys misbehave from Blink, drop these two lines first.
set -s extended-keys on
set -as terminal-features ",*:extkeys"
