name: Bootstrap

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: cp -r $GITHUB_WORKSPACE ~/
    - run: |
        cd ~ && pwd
        cd ~ && ls -lah
