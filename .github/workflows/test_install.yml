name: Bootstrap

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: ~
    - run: |
        ls -lah
        pwd
        cd ~ && pwd
        cd ~ && ls -lah
    #- run: chmod +x bootstrap.sh && ./bootstrap.sh
